<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1E23">
<title>Тетрадь — заметки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12141C;
    --panel: #1A1D28;
    --panel-2: #212533;
    --panel-3: #282D3D;
    --line: #333849;
    --line-soft: #262a38;
    --text: #EDEEF2;
    --text-dim: #8C92A6;
    --accent: #FF6F5E;
    --accent-soft: rgba(255,111,94,0.16);
    --blue: #6C8FAE;
    --error: #E5484D;
    --radius: 18px;
    --radius-sm: 12px;
    --radius-lg: 26px;
    --shadow-soft: 0 8px 24px rgba(0,0,0,0.32);
    --shadow-lift: 0 16px 40px rgba(0,0,0,0.42);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
    --dur-fast: 0.15s;
    --dur: 0.22s;
    --dur-slow: 0.38s;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes modalCardIn {
    from { opacity: 0; transform: translateY(18px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes slideInFromRight {
    from { opacity: 0; transform: translateX(16px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInFromLeft {
    from { opacity: 0; transform: translateX(-16px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.7); }
    60% { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes pulseOnce {
    0% { transform: scale(1); }
    30% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  @keyframes shakeError {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes barFill {
    from { width: 0%; }
  }
  @keyframes softPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .loading-pulse {
    animation: softPulse 1.1s ease-in-out infinite;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    animation: fadeIn var(--dur-slow) var(--ease-soft);
    position: relative;
  }

  ::selection { background: var(--accent-soft); color: var(--text); }

  button {
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
  }

  input, textarea {
    font-family: inherit;
  }
  /* Prevent iOS auto-zoom on focus: keep inputs >=16px on small screens */
  input, textarea, select { font-size: 16px; }

  a { color: inherit; }

  .hidden { display: none !important; }

  /* ---------- AUTH SCREEN ---------- */

  #auth-screen {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    padding-top: calc(32px + var(--safe-top));
    padding-bottom: calc(32px + var(--safe-bottom));
    position: relative;
    overflow: hidden;
    z-index: 1;
  }

  #auth-screen::before {
    content: "";
    position: absolute;
    top: -20%;
    left: 60%;
    width: 60vw;
    height: 60vw;
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
    pointer-events: none;
  }

  .auth-wrap {
    width: 100%;
    max-width: 380px;
    position: relative;
    z-index: 1;
    animation: fadeSlideUp var(--dur-slow) var(--ease);
  }

  .auth-mark {
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
    font-family: 'JetBrains Mono', monospace;
  }

  .auth-title {
    font-size: 42px;
    font-weight: 500;
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
    font-variant: small-caps;
  }

  .auth-title em {
    color: var(--accent);
    font-style: normal;
  }

  .auth-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    margin: 0 0 36px;
    line-height: 1.6;
  }

  .auth-tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--line);
  }

  .auth-tab {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 12px 4px;
    margin-right: 24px;
    border-bottom: 2px solid transparent;
    transform: translateY(1px);
    transition: color var(--dur) var(--ease-soft), border-color var(--dur) var(--ease-soft);
  }

  .auth-tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 7px;
    font-variant: small-caps;
    letter-spacing: 0.02em;
  }

  .field input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 16px;
    padding: 12px 13px;
    outline: none;
    transition: border-color var(--dur) var(--ease-soft), background var(--dur) var(--ease-soft), box-shadow var(--dur) var(--ease-soft), transform var(--dur-fast) var(--ease-soft);
    min-height: 44px;
  }

  .field input:focus {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }

  .field input:focus {
    border-color: var(--accent);
    background: var(--panel-2);
  }

  .auth-error {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--error);
    background: rgba(183,92,74,0.1);
    border: 1px solid rgba(183,92,74,0.3);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-bottom: 18px;
    line-height: 1.5;
    animation: fadeSlideDown var(--dur) var(--ease-soft), shakeError 0.4s var(--ease-soft);
  }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    color: #1B1E23;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 13.5px;
    padding: 14px;
    margin-top: 6px;
    min-height: 46px;
    transition: filter var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft), box-shadow var(--dur-fast) var(--ease-soft);
  }

  .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(255,111,94,0.25); }
  .btn-primary:active { filter: brightness(0.95); transform: scale(0.98); box-shadow: none; }

  .auth-foot {
    margin-top: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  #login-form, #register-form {
    animation: fadeSlideUp var(--dur) var(--ease-soft);
  }

  /* ---------- APP SHELL ---------- */

  #app {
    display: flex;
    height: 100vh;
    height: 100dvh;
    animation: fadeIn var(--dur-slow) var(--ease-soft);
    position: relative;
    z-index: 1;
  }

  /* Sidebar */
  #sidebar {
    width: 280px;
    flex-shrink: 0;
    background: rgba(26,29,40,0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding-top: var(--safe-top);
    padding-left: var(--safe-left);
    min-height: 0;
  }

  .side-head {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .side-title {
    font-size: 21px;
    font-weight: 500;
    font-variant: small-caps;
    letter-spacing: 0.02em;
  }

  .side-user {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .side-user span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .side-user-btns {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .side-user button {
    background: none;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    padding: 9px 14px;
    min-height: 40px;
    min-width: 44px;
    transition: border-color var(--dur-fast) var(--ease-soft), color var(--dur-fast) var(--ease-soft), background var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft);
  }
  .side-user button:hover { border-color: var(--error); color: var(--error); transform: translateY(-1px); }
  .side-user button:active { transform: scale(0.96); }

  /* Immutable per-user ID, shown under the display name / logout row */
  .side-user-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    opacity: 0.6;
    margin-top: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
    transition: opacity var(--dur-fast) var(--ease-soft), color var(--dur-fast) var(--ease-soft);
  }
  .side-user-id:hover { opacity: 1; color: var(--accent); }

  .quota {
    padding: 14px 20px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  .quota-bar {
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }
  .quota-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width var(--dur-slow) var(--ease), background var(--dur) var(--ease-soft);
  }
  .quota-bar-fill.full { background: var(--error); }

  #note-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 6px 10px;
    min-height: 80px;
  }

  .note-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    border: 1px solid transparent;
    min-height: 44px;
    transition: background var(--dur-fast) var(--ease-soft), border-color var(--dur-fast) var(--ease-soft), box-shadow var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft);
    animation: fadeSlideUp var(--dur) var(--ease-soft) backwards;
  }

  .note-item:hover { background: var(--panel-2); transform: translateX(2px); }
  .note-item:active { transform: scale(0.99); }

  .note-item.active {
    background: var(--panel-2);
    border-color: var(--line);
    box-shadow: var(--shadow-soft);
  }

  .note-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    width: 16px;
    flex-shrink: 0;
  }

  .note-item.active .note-num { color: var(--accent); }

  .note-item-title {
    font-size: 14.5px;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-item-empty { color: var(--text-dim); }


  .note-item-empty-state {
    padding: 28px 16px;
    text-align: center;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.6;
    animation: fadeIn var(--dur-slow) var(--ease-soft);
  }

  .new-note-btn {
    margin: 12px 14px 16px;
    background: none;
    border: 1px dashed var(--line);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    padding: 12px;
    text-align: left;
    min-height: 44px;
    flex-shrink: 0;
    transition: border-color var(--dur-fast) var(--ease-soft), color var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft), background var(--dur-fast) var(--ease-soft);
  }
  .new-note-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }
  .new-note-btn:active:not(:disabled) { transform: scale(0.98); }
  .new-note-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Editor */
  #editor-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    padding-top: var(--safe-top);
    padding-right: var(--safe-right);
  }

  .editor-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
    flex-wrap: nowrap;
    animation: fadeSlideDown var(--dur) var(--ease-soft);
  }

  .editor-title-input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    font-variant: small-caps;
    width: 100%;
    min-width: 0;
  }
  .editor-title-input::placeholder { color: var(--text-dim); }

  .editor-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    margin-left: 20px;
  }

  .save-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text-dim);
    min-width: 100px;
    text-align: right;
    flex-shrink: 0;
    transition: color var(--dur) var(--ease-soft);
  }
  .save-status.saved { color: var(--accent); animation: fadeIn var(--dur) var(--ease-soft); }

  .word-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    flex-shrink: 0;
    transition: color var(--dur) var(--ease-soft);
  }
  .word-counter.limit-reached { color: var(--error); animation: shakeError 0.4s var(--ease-soft); }

  .icon-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 9px 13px;
    min-height: 38px;
    white-space: nowrap;
    transition: border-color var(--dur-fast) var(--ease-soft), color var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft);
  }
  .icon-btn:hover { border-color: var(--error); color: var(--error); transform: translateY(-1px); }
  .icon-btn:active { transform: scale(0.96); }
  .icon-btn.neutral:hover { border-color: var(--accent); color: var(--accent); }

  .mobile-back-btn {
    display: inline-flex;
    align-items: center;
    background: none;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    padding: 9px 14px;
    min-height: 40px;
    flex-shrink: 0;
    margin-right: 10px;
    transition: border-color var(--dur-fast) var(--ease-soft), color var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft);
  }
  .mobile-back-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .mobile-back-btn:active { transform: scale(0.95) translateX(-2px); }

  #note-textarea {
    flex: 1;
    width: 100%;
    background: var(--bg);
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14.5px;
    line-height: 1.7;
    padding: 24px 28px 40px;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: break-word;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    tab-size: 4;
    -moz-tab-size: 4;
    animation: fadeIn var(--dur) var(--ease-soft);
  }

  .editor-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: var(--text-dim);
    padding: 24px;
    text-align: center;
    animation: fadeIn var(--dur-slow) var(--ease-soft);
  }
  .editor-empty-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    color: var(--text);
    font-variant: small-caps;
  }
  .editor-empty-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .info-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    width: 26px;
    height: 26px;
    min-width: 26px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: border-color .15s ease, color .15s ease;
  }
  .info-btn:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.08); }
  .info-btn { transition: border-color var(--dur-fast) var(--ease-soft), color var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft); }
  .editor-empty button {
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    color: #1B1E23;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    padding: 12px 20px;
    margin-top: 8px;
    min-height: 44px;
    transition: filter var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft);
  }
  .editor-empty button:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .editor-empty button:active { transform: scale(0.97); }

  /* Scrollbars, subtle — themed to match the site's own colors everywhere,
     not just note list/textarea, so no default white OS scrollbar ever shows. */
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 5px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }

  /* Focus visibility for accessibility */
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- PLAN BADGE + UPGRADE BUTTON ---------- */

  .plan-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px 0;
    flex-shrink: 0;
  }

  .plan-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 20px;
    border: 1px solid var(--line);
    color: var(--text-dim);
  }
  .plan-badge.plan-free { color: var(--text-dim); }
  .plan-badge.plan-s { color: var(--blue); border-color: rgba(91,122,150,0.4); background: rgba(91,122,150,0.08); }

    line-height: 1.5;
    transition: border-color var(--dur-fast) var(--ease-soft), background var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft);
  }
  .dialog-history-item:hover { border-color: var(--accent); background: var(--panel-2); transform: translateX(2px); }
  .dialog-history-item:active { transform: scale(0.99); }
  .dialog-history-time {
    color: var(--accent);
    font-weight: 600;
    margin-right: 8px;
  }
  .dialog-history-preview { color: var(--text-dim); }

  @media (max-width: 760px) {
    .dialog-card { max-width: 100%; }
  }

  /* ---------- Note options: pin + folders/tags + search ---------- */

  .sidebar-search {
    padding: 10px 20px 0;
    flex-shrink: 0;
  }
  .sidebar-search input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 9px 10px;
    outline: none;
    min-height: 40px;
  }
  .sidebar-search input:focus { border-color: var(--accent); }
  .sidebar-search { animation: fadeSlideDown var(--dur) var(--ease-soft); }

  .note-pin-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 15px;
    padding: 6px;
    flex-shrink: 0;
    line-height: 1;
    transition: color var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease);
  }
  .note-pin-btn.pinned { color: var(--accent); animation: popIn var(--dur) var(--ease); }
  .note-pin-btn:hover { transform: scale(1.2); }
  .note-pin-btn:active { transform: scale(0.9); }

  .note-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--blue);
    border: 1px solid rgba(91,122,150,0.35);
    border-radius: 20px;
    padding: 2px 7px;
    flex-shrink: 0;
    max-width: 80px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    animation: scaleIn var(--dur) var(--ease-soft);
  }

  .locked-feature-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 11px 20px;
    padding-bottom: calc(11px + var(--safe-bottom));
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    border-top: 1px solid var(--line);
    flex-shrink: 0;
    animation: fadeIn var(--dur-slow) var(--ease-soft);
    transition: opacity var(--dur) var(--ease-soft);
  }
  .locked-feature-row span { min-width: 0; }
  .locked-feature-row button {
    background: none;
    border: none;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 4px 0;
    flex-shrink: 0;
  }

  /* Unlock note screen */
  .unlock-input {
    margin-top: 14px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--text);
    padding: 11px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    width: 220px;
    max-width: 100%;
    text-align: center;
    outline: none;
  }
  .unlock-input:focus { border-color: var(--accent); }
  .unlock-input {
    transition: border-color var(--dur) var(--ease-soft), transform var(--dur-fast) var(--ease-soft);
    animation: fadeSlideUp var(--dur) var(--ease-soft);
  }
  .unlock-input.shake { animation: shakeError 0.4s var(--ease-soft); }

  /* ---------- SECTION SWITCHER (Notes / Groups) ---------- */

  .section-switcher {
    display: flex;
    gap: 0;
    padding: 12px 20px 0;
    flex-shrink: 0;
  }
  .section-tab {
    flex: 1;
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    padding: 9px 6px;
    min-height: 38px;
    transition: border-color var(--dur) var(--ease-soft), color var(--dur) var(--ease-soft), background var(--dur) var(--ease-soft);
  }
  .section-tab:first-child {
    border-top-left-radius: var(--radius-sm);
    border-bottom-left-radius: var(--radius-sm);
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
    margin-right: -1px;
  }
  .section-tab:last-child {
    border-top-right-radius: var(--radius-sm);
    border-bottom-right-radius: var(--radius-sm);
    border-top-left-radius: 0;
    border-bottom-left-radius: 0;
  }
  .section-tab.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
    position: relative;
    z-index: 1;
  }

  /* ---------- GROUPS ---------- */

  #groups-panel {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    min-height: 80px;
    padding: 14px 20px 6px;
    animation: fadeIn var(--dur) var(--ease-soft);
  }

  .groups-block-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 18px 0 10px;
  }
  .groups-block-title:first-child { margin-top: 0; }

  .groups-block-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 18px 0 10px;
  }
  .groups-block-title-row:first-child { margin-top: 0; }
  .groups-block-title-row .groups-block-title {
    margin: 0;
  }

  .group-form {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 14px;
    animation: fadeSlideUp var(--dur) var(--ease-soft);
  }
  .group-form .field { margin-bottom: 10px; }
  .group-form .field:last-of-type { margin-bottom: 12px; }
  .group-form .field label { font-size: 10.5px; margin-bottom: 5px; }
  .group-form .field input {
    padding: 10px 11px;
    min-height: 40px;
    font-size: 14px;
    background: var(--panel);
  }
  .group-form-btn {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    color: #1B1E23;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 12.5px;
    padding: 11px;
    min-height: 42px;
    transition: filter var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft);
  }
  .group-form-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .group-form-btn:active { transform: scale(0.98); }
  .group-form-btn.secondary {
    background: none;
    border: 1px solid var(--line);
    color: var(--text);
    font-weight: 500;
  }
  .group-form-btn.secondary:hover { border-color: var(--accent); color: var(--accent); }

  .group-form-error {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--error);
    background: rgba(183,92,74,0.1);
    border: 1px solid rgba(183,92,74,0.3);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    margin-bottom: 10px;
    line-height: 1.5;
    animation: fadeSlideDown var(--dur) var(--ease-soft), shakeError 0.4s var(--ease-soft);
  }

  .group-quota-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .group-quota-line a, .group-quota-line button {
    background: none;
    border: none;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 2px 0;
    flex-shrink: 0;
  }

  .group-form-checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    cursor: pointer;
    user-select: none;
  }
  .group-form-checkbox input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    min-width: 18px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--panel);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color var(--dur) var(--ease-soft), background var(--dur) var(--ease-soft);
  }
  .group-form-checkbox input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .group-form-checkbox input[type="checkbox"]:checked::after {
    content: "";
    width: 5px;
    height: 9px;
    border-right: 2px solid #12141C;
    border-bottom: 2px solid #12141C;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .group-form-checkbox label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
  }
  .group-lock-tag {
    font-size: 9px;
    color: var(--text-dim);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1px 6px;
    flex-shrink: 0;
  }

  .recent-group-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    border: 1px solid transparent;
    min-height: 44px;
    transition: background var(--dur-fast) var(--ease-soft), border-color var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft);
    animation: fadeSlideUp var(--dur) var(--ease-soft) backwards;
  }
  .recent-group-item:hover { background: var(--panel-2); transform: translateX(2px); }
  .recent-group-item:active { transform: scale(0.99); }
  .recent-group-item.active { background: var(--panel-2); border-color: var(--line); }
  .recent-group-name {
    font-size: 14.5px;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .recent-group-owner-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    color: var(--accent);
    border: 1px solid rgba(255,111,94,0.4);
    border-radius: 20px;
    padding: 2px 6px;
    flex-shrink: 0;
  }

  /* Group feed area (reuses #editor-area layout) */
  .group-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .group-topbar-title {
    font-size: 22px;
    font-weight: 500;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-variant: small-caps;
  }
  .group-topbar-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 3px;
  }

  .group-topbar { animation: fadeSlideDown var(--dur) var(--ease-soft); }

  .group-feed {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .group-post {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    max-width: 640px;
    box-shadow: var(--shadow-soft);
    animation: fadeSlideUp var(--dur-slow) var(--ease-soft) backwards;
  }
  .group-post-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
  }
  .group-post-author {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--accent);
    font-weight: 600;
  }
  .group-post-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .group-post-meta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-shrink: 0;
  }
  .group-post-copy-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    padding: 2px 0;
    flex-shrink: 0;
    transition: color var(--dur) var(--ease-soft);
  }
  .group-post-copy-btn:hover { color: var(--accent); }
  .group-post-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .group-feed-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    text-align: center;
    padding: 24px;
    animation: fadeIn var(--dur-slow) var(--ease-soft);
  }

  .group-composer {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 16px 28px;
    padding-bottom: calc(16px + var(--safe-bottom));
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }
  .group-composer textarea {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 11px 13px;
    outline: none;
    resize: none;
    min-height: 46px;
    max-height: 140px;
    line-height: 1.5;
  }
  .group-composer textarea:focus { border-color: var(--accent); }
  .group-composer textarea {
    transition: border-color var(--dur-fast) var(--ease-soft), height var(--dur-fast) var(--ease-soft);
  }
  .group-composer button {
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    color: #1B1E23;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 12.5px;
    padding: 0 18px;
    min-height: 46px;
    flex-shrink: 0;
    transition: filter var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft), opacity var(--dur-fast) var(--ease-soft);
  }
  .group-composer button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  .group-composer button:active:not(:disabled) { transform: scale(0.96); }
  .group-composer button:disabled { opacity: 0.4; cursor: default; }

  .group-composer-limit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    padding: 0 28px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
  }
  .group-composer-limit button {
    background: none;
    border: none;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 2px 0;
    flex-shrink: 0;
  }

  .group-leave-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 9px 13px;
    min-height: 38px;
    white-space: nowrap;
    flex-shrink: 0;
    transition: border-color var(--dur-fast) var(--ease-soft), color var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft);
  }
  .group-leave-btn:hover { border-color: var(--error); color: var(--error); transform: translateY(-1px); }
  .group-leave-btn:active { transform: scale(0.96); }

  /* ================= RESPONSIVE ================= */

  @media (max-width: 760px) {
    #app {
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    #sidebar {
      width: 100%;
      height: 100%;
      border-right: none;
      flex-shrink: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      animation: slideInFromLeft var(--dur-slow) var(--ease-soft);
    }
    #sidebar.mobile-hidden { display: none; }

    .side-head {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .side-title { font-size: 17px; }
    .side-user { margin-top: 0; }

    #note-list { max-height: none; }

    #editor-area {
      display: none;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
    }
    #editor-area.mobile-visible { display: flex; animation: slideInFromRight var(--dur-slow) var(--ease-soft); }

    .auth-title { font-size: 30px; }
    .auth-wrap { max-width: 100%; }
    #auth-screen { padding: 24px 18px; }

    .editor-topbar {
      padding: 12px 14px;
      flex-wrap: wrap;
      row-gap: 10px;
    }
    .editor-title-input { font-size: 18px; }
    .editor-actions {
      flex-wrap: wrap;
      row-gap: 8px;
      margin-left: 0;
      width: 100%;
      justify-content: flex-end;
    }
    .save-status { min-width: auto; order: 10; flex-basis: 100%; text-align: left; padding-top: 2px; }

    #note-textarea { padding: 14px 14px 24px; font-size: 15px; }

    .modal-overlay { padding: 0; align-items: stretch; }
    .modal-card {
      max-width: 100%;
      min-height: 100%;
      border-radius: 0;
      padding: 24px 18px calc(24px + var(--safe-bottom));
      padding-top: calc(24px + var(--safe-top));
      border: none;
    }
    .modal-title { font-size: 24px; padding-right: 36px; }
    .modal-sub { max-width: 100%; }
    .plans-grid { grid-template-columns: 1fr; }
    .plan-card { padding: 18px 16px; }
    .checkout-box { max-width: 100%; padding: 18px; }
    .checkout-fields-row { flex-direction: row; }

    .editor-empty { padding: 40px 20px; }
    .editor-empty-title { font-size: 19px; }

    .section-switcher { padding: 10px 14px 0; }
    #groups-panel { padding: 12px 14px 6px; }
    .group-topbar { padding: 12px 14px; }
    .group-topbar-title { font-size: 18px; }
    .group-feed { padding: 14px; }
    .group-post { max-width: 100%; }
    .group-composer { padding: 12px 14px; padding-bottom: calc(12px + var(--safe-bottom)); }
    .group-composer-limit { padding: 0 14px 8px; }
  }

  /* Comfortable tablet / small desktop range */
  @media (min-width: 761px) and (max-width: 1024px) {
    #sidebar { width: 240px; }
    .editor-topbar { padding: 14px 22px; }
    #note-textarea { padding: 20px 22px 36px; }
    .plans-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* Larger desktop: give the editor more breathing room */
  @media (min-width: 1400px) {
    #sidebar { width: 300px; }
    #note-textarea { padding: 32px 48px 56px; font-size: 15px; }
    .editor-topbar { padding: 18px 48px; }
  }
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div id="auth-screen">
  <div class="auth-wrap">
    <div class="auth-mark">тетрадь</div>
    <h1 class="auth-title">Заметки,<br><em>как вы их написали.</em></h1>
    <p class="auth-sub">Табы, пробелы, переносы строк — сохраняется точь-в-точь. 10 заметок бесплатно.</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')" type="button">вход</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')" type="button">регистрация</button>
    </div>

    <div id="auth-error" class="auth-error hidden" role="alert"></div>

    <!-- LOGIN FORM -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="login-username">Email</label>
        <input type="email" id="login-username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Пароль</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary">Войти</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
      <div class="field">
        <label for="reg-username">Отображаемое имя</label>
        <input type="text" id="reg-username" autocomplete="username" minlength="2" required>
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="reg-password">Пароль</label>
        <input type="password" id="reg-password" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="field">
        <label for="reg-password2">Повторите пароль</label>
        <input type="password" id="reg-password2" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" class="btn-primary">Создать аккаунт</button>
    </form>

    <div class="auth-foot" id="auth-foot-note">Данные хранятся в облаке и доступны с любого устройства.</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="side-head" id="side-head">
      <div>
        <div class="side-title">Тетрадь</div>
        <div class="side-user">
          <span id="current-username"></span>

function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = (hash << 5) - hash + str.charCodeAt(i);
    hash |= 0;
  }
  return 'h' + hash.toString(36) + str.length;
}

// Generic clipboard helper with a fallback for browsers/contexts where
// navigator.clipboard isn't available (matches the approach copyUserId used).
function copyTextToClipboard(text, onDone) {
  const fallbackCopy = () => {
    const tmp = document.createElement('textarea');
    tmp.value = text;
    tmp.style.position = 'fixed';
    tmp.style.opacity = '0';
    document.body.appendChild(tmp);
    tmp.select();
    try { document.execCommand('copy'); } catch (err) { /* noop */ }
    document.body.removeChild(tmp);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => onDone && onDone(true)).catch(() => {
      fallbackCopy();
      onDone && onDone(true);
    });
  } else {
    fallbackCopy();
    onDone && onDone(true);
  }
}

// <input type="color"> requires a #rrggbb value; convert rgba()/named
// values from computed styles to hex, falling back to the default.
function toHexColor(value, fallback) {
  if (!value) return fallback;
  const v = value.trim();
  if (/^#([0-9a-f]{6})$/i.test(v)) return v;
  if (/^#([0-9a-f]{3})$/i.test(v)) {
    return '#' + v.slice(1).split('').map(c => c + c).join('');
  }
  const m = v.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
  if (m) {
    const toHex = n => Number(n).toString(16).padStart(2, '0');
    return '#' + toHex(m[1]) + toHex(m[2]) + toHex(m[3]);
  }
  return fallback;
}

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return {
    r: parseInt(h.substring(0, 2), 16),
    g: parseInt(h.substring(2, 4), 16),
    b: parseInt(h.substring(4, 6), 16),
  };
}

function rgbToHex(r, g, b) {
  const c = n => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
  return '#' + c(r) + c(g) + c(b);
}

// Relative luminance (WCAG-style approximation) — used to detect when two
// colors are too visually close (e.g. an accent that blends into its own
// background), not for exact accessibility contrast-ratio compliance.
function relativeLuminance(hex) {
  const { r, g, b } = hexToRgb(hex);
  const lin = c => {
    const p = c / 255;
    return p <= 0.03928 ? p / 12.92 : Math.pow((p + 0.055) / 1.055, 2.4);
  };
  return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
}

function contrastRatio(hexA, hexB) {
  const lA = relativeLuminance(hexA);
  const lB = relativeLuminance(hexB);
  const lighter = Math.max(lA, lB);
  const darker = Math.min(lA, lB);
  return (lighter + 0.05) / (darker + 0.05);
}

// If a color is too close in luminance to a reference (its usual background),
// push it toward black or white until it's distinguishable again — this is
// what keeps e.g. the accent color from "disappearing" into a similarly-toned
// panel background and turning a card into a solid color block.
function ensureContrast(hex, referenceHex, minRatio) {
  if (contrastRatio(hex, referenceHex) >= minRatio) return hex;
  const refIsLight = relativeLuminance(referenceHex) > 0.5;
  let { r, g, b } = hexToRgb(hex);
  for (let i = 0; i < 20; i++) {
    const step = refIsLight ? -12 : 12;
    r += step; g += step; b += step;
    const candidate = rgbToHex(r, g, b);
    if (contrastRatio(candidate, referenceHex) >= minRatio) return candidate;
  }
  return refIsLight ? '#0A0A0A' : '#FFFFFF';
}

// Minimum contrast checks between color pairs that appear together in the
// UI. Each entry auto-corrects `key`'s color if it gets too close to
// `against`'s color, so a bad theme choice can't render a whole block
// unreadable (e.g. accent buttons vanishing into the featured plan card).
const THEME_CONTRAST_RULES = [
  { key: '--accent',   against: '--panel-3', minRatio: 2.2 },
  { key: '--accent',   against: '--bg',      minRatio: 1.8 },
  { key: '--text',     against: '--bg',      minRatio: 4.5 },
  { key: '--text-dim', against: '--bg',      minRatio: 2.5 },
];

// Runs every contrast rule against the given values object (as produced by
// getCurrentThemeValues) and returns { values, warnings } — values has any
// necessary auto-corrections applied, warnings lists which keys were adjusted
// and why, for a small inline notice in the theme panel.
function enforceThemeContrast(values) {
  const result = { ...values };
  const warnings = [];
  THEME_CONTRAST_RULES.forEach(rule => {
    const color = result[rule.key];
    const reference = result[rule.against];
    if (!color || !reference) return;
    const fixed = ensureContrast(color, reference, rule.minRatio);
    if (fixed.toLowerCase() !== color.toLowerCase()) {
      result[rule.key] = fixed;
      warnings.push({ key: rule.key, against: rule.against });
    }
  });
  return { values: result, warnings };
}

function showAlert(message, eyebrow) {
  return new Promise(resolve => {
    const overlay = document.getElementById('dialog-overlay');
    const card = document.getElementById('dialog-card');
    card.innerHTML = `
      ${eyebrow ? `<div class="dialog-eyebrow">${escapeHtml(eyebrow)}</div>` : ''}
      <div class="dialog-message"></div>
      <div class="dialog-actions">
        <button type="button" class="dialog-btn primary" id="dialog-ok-btn">Понятно</button>
      </div>
    `;
    card.querySelector('.dialog-message').textContent = message;
    overlay.classList.remove('hidden');
    const finish = () => { closeDialog(); resolve(); };
    document.getElementById('dialog-ok-btn').onclick = finish;
    overlay.onclick = (e) => { if (e.target === overlay) finish(); };
    document.getElementById('dialog-ok-btn').focus();
  });
}

function showConfirm(message, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    const overlay = document.getElementById('dialog-overlay');
    const card = document.getElementById('dialog-card');
    const confirmLabel = opts.confirmLabel || 'Да';
    const cancelLabel = opts.cancelLabel || 'Отмена';
    const danger = opts.danger;
    card.innerHTML = `
      ${opts.eyebrow ? `<div class="dialog-eyebrow">${escapeHtml(opts.eyebrow)}</div>` : ''}
      <div class="dialog-message"></div>
      <div class="dialog-actions">
        <button type="button" class="dialog-btn" id="dialog-cancel-btn">${escapeHtml(cancelLabel)}</button>
        <button type="button" class="dialog-btn ${danger ? 'danger' : 'primary'}" id="dialog-confirm-btn">${escapeHtml(confirmLabel)}</button>
      </div>
    `;
    card.querySelector('.dialog-message').textContent = message;
    overlay.classList.remove('hidden');
    const finish = (result) => { closeDialog(); resolve(result); };
    document.getElementById('dialog-confirm-btn').onclick = () => finish(true);
    document.getElementById('dialog-cancel-btn').onclick = () => finish(false);
    overlay.onclick = (e) => { if (e.target === overlay) finish(false); };
  });
}

function showPrompt(message, defaultValue, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    const overlay = document.getElementById('dialog-overlay');
    const card = document.getElementById('dialog-card');
    card.innerHTML = `
      ${opts.eyebrow ? `<div class="dialog-eyebrow">${escapeHtml(opts.eyebrow)}</div>` : ''}
      <div class="dialog-message"></div>
      <input type="${opts.password ? 'password' : 'text'}" class="dialog-input" id="dialog-prompt-input">
      <div class="dialog-actions">
        <button type="button" class="dialog-btn" id="dialog-cancel-btn">Отмена</button>
        <button type="button" class="dialog-btn primary" id="dialog-confirm-btn">${escapeHtml(opts.confirmLabel || 'Готово')}</button>
      </div>
    `;
    card.querySelector('.dialog-message').textContent = message;
    const input = document.getElementById('dialog-prompt-input');
    input.value = defaultValue || '';
    overlay.classList.remove('hidden');
    const finish = (result) => { closeDialog(); resolve(result); };
    document.getElementById('dialog-confirm-btn').onclick = () => finish(input.value);
    document.getElementById('dialog-cancel-btn').onclick = () => finish(null);
    overlay.onclick = (e) => { if (e.target === overlay) finish(null); };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') finish(input.value);
      if (e.key === 'Escape') finish(null);
    });
    setTimeout(() => { input.focus(); input.select(); }, 30);
  });
}

/* Special-purpose dialog for restoring a note version from history:
   renders a clickable list instead of a free-text prompt. Resolves
   with the picked history row's index, or null if cancelled. */
function showHistoryPicker(historyRows) {
  return new Promise(resolve => {
    const overlay = document.getElementById('dialog-overlay');
    const card = document.getElementById('dialog-card');
    const itemsHtml = historyRows.map((h, i) => {
      const d = new Date(h.at);
      const pad = n => String(n).padStart(2, '0');
      const time = pad(d.getHours()) + ':' + pad(d.getMinutes());
      const preview = (h.content || '').slice(0, 60).replace(/\n/g, ' ');
      return `
        <button type="button" class="dialog-history-item" data-idx="${i}">
          <span class="dialog-history-time">${time}</span><span class="dialog-history-preview">${escapeHtml(preview || '(пусто)')}</span>
        </button>`;
    }).join('');
    card.innerHTML = `
      <div class="dialog-eyebrow">история версий</div>
      <div class="dialog-message">Выберите версию, чтобы восстановить её (сверху — самая новая).</div>
      <div class="dialog-history-list">${itemsHtml}</div>
      <div class="dialog-actions">
        <button type="button" class="dialog-btn" id="dialog-cancel-btn" style="width:100%;">Отмена</button>
      </div>
    `;
    overlay.classList.remove('hidden');
    const finish = (result) => { closeDialog(); resolve(result); };
    card.querySelectorAll('.dialog-history-item').forEach(btn => {
      btn.onclick = () => finish(parseInt(btn.dataset.idx, 10));
    });
    document.getElementById('dialog-cancel-btn').onclick = () => finish(null);
    overlay.onclick = (e) => { if (e.target === overlay) finish(null); };
  });
}

/* =========================================================
   AUTH SCREEN LOGIC
   ========================================================= */

function switchTab(which) {
  const loginTab = document.getElementById('tab-login');
  const regTab = document.getElementById('tab-register');
  const loginForm = document.getElementById('login-form');
  const regForm = document.getElementById('register-form');
  hideError();

  if (which === 'login') {
    loginTab.classList.add('active');
    regTab.classList.remove('active');
    loginForm.classList.remove('hidden');
    regForm.classList.add('hidden');
  } else {
    regTab.classList.add('active');
    loginTab.classList.remove('active');
    regForm.classList.remove('hidden');
    loginForm.classList.add('hidden');
  }
}

function showError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.classList.remove('hidden');
}
function hideError() {
  document.getElementById('auth-error').classList.add('hidden');
}

async function handleRegister(e) {
  e.preventDefault();
  hideError();

  const displayName = document.getElementById('reg-username').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const password2 = document.getElementById('reg-password2').value;

  if (displayName.length < 2) { showError('Имя должно содержать не менее 2 символов.'); return; }
  if (password.length < 6) { showError('Пароль должен содержать не менее 6 символов.'); return; }
  if (password !== password2) { showError('Пароли не совпадают.'); return; }

  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;

  try {
    const { data, error } = await db.auth.signUp({
      email, password,
      options: { data: { display_name: displayName } }
    });

    if (error) {
      showError(translateAuthError(error.message));
      return;
    }

    if (data.session) {
      await enterApp(data.session.user);
    } else {
      showError('Проверьте почту — нужно подтвердить email, затем войдите.');
      switchTab('login');
    }
  } catch (err) {
    console.error('Registration failed:', err);
    showError('Не удалось зарегистрироваться: ' + (err && err.message ? err.message : 'неизвестная ошибка') + '. Попробуйте ещё раз.');
  } finally {
    submitBtn.disabled = false;
  }
}

async function handleLogin(e) {
  e.preventDefault();
  hideError();

  const email = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;

  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;

  try {
    const { data, error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      showError(translateAuthError(error.message));
      return;
    }

    await enterApp(data.user);
    document.getElementById('login-form').reset();
  } catch (err) {
    console.error('Login failed:', err);
    showError('Не удалось войти: ' + (err && err.message ? err.message : 'неизвестная ошибка') + '. Попробуйте ещё раз.');
  } finally {
    submitBtn.disabled = false;
  }
}

function translateAuthError(msg) {
  if (/invalid login credentials/i.test(msg)) return 'Неверный email или пароль.';
  if (/already registered/i.test(msg)) return 'Такой email уже зарегистрирован.';
  if (/password.*at least/i.test(msg)) return 'Пароль слишком короткий.';
  return msg;
}

async function handleLogout() {
  await db.auth.signOut();
  currentUser = null;
  currentProfile = null;
  notes = [];
  activeNoteId = null;
  unlockedNoteId = null;
  activeGroupName = null;
  activeGroupId = null;
  currentSection = 'notes';
  showMobileList();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('auth-screen').classList.remove('hidden');
  switchTab('login');
}

/* =========================================================
   PERMANENT USER ID (rendered next to display name)
   currentUser.id is the Supabase Auth UUID: it is generated once,
   at sign-up, and never changes for that account afterwards — not
   on email change, password change, or display-name change. It is
   exactly the "personal ID that stays with the user forever".
   ========================================================= */

function renderUserId() {
  const el = document.getElementById('current-user-id');
  if (!el) return;
  if (currentUser && currentUser.id) {
    el.textContent = 'id: ' + currentUser.id;
    el.classList.remove('hidden');
  } else {
    el.textContent = '';
  }
}

function copyUserId() {
  if (!currentUser || !currentUser.id) return;
  const el = document.getElementById('current-user-id');
  const restore = () => { if (el) renderUserId(); };

  const fallbackCopy = () => {
    const tmp = document.createElement('textarea');
    tmp.value = currentUser.id;
    tmp.style.position = 'fixed';
    tmp.style.opacity = '0';
    document.body.appendChild(tmp);
    tmp.select();
    try { document.execCommand('copy'); } catch (err) { /* noop */ }
    document.body.removeChild(tmp);
  };

  const showCopied = () => {
    if (!el) return;
    el.textContent = 'id скопирован ✓';
    setTimeout(restore, 1200);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(currentUser.id).then(showCopied).catch(() => {
      fallbackCopy();
      showCopied();
    });
  } else {
    fallbackCopy();
    showCopied();
  }
}

/* =========================================================
   APP ENTRY
   ========================================================= */

async function enterApp(user) {
  currentUser = user;

  const { data: profile, error } = await db
    .from('profiles')
    .select('*')
    .eq('id', user.id)
    .single();

  if (error || !profile) {
    // Profile trigger may still be running right after signup — retry a few times.
    let retryProfile = null;
    for (let i = 0; i < 5 && !retryProfile; i++) {
      await new Promise(r => setTimeout(r, 500));
      const retry = await db.from('profiles').select('*').eq('id', user.id).single();
      if (retry.data) retryProfile = retry.data;
    }
    currentProfile = retryProfile || { id: user.id, display_name: user.email, plan: 'free' };
  } else {
    currentProfile = profile;
  }

  if (currentProfile.banned) {
    await db.auth.signOut();
    currentUser = null;
    currentProfile = null;
    showError('Этот аккаунт заблокирован администратором.');
    return;
  }

  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('current-username').textContent = currentProfile.display_name;
  renderUserId();
  document.getElementById('admin-row').classList.toggle('hidden', !currentProfile.is_admin);

  activeGroupName = null;
  activeGroupId = null;
  currentSection = 'notes';
  showMobileList();
  document.getElementById('tab-section-notes').classList.add('active');
  document.getElementById('tab-section-groups').classList.remove('active');
  document.getElementById('notes-section').classList.remove('hidden');
  document.getElementById('groups-panel').classList.add('hidden');

  await loadNotes();
  renderSidebar();
  renderEditor();
}

async function loadNotes() {
  const { data, error } = await db
    .from('notes')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('pinned', { ascending: false })
    .order('updated_at', { ascending: false });

  notes = error ? [] : data;
  activeNoteId = notes.length > 0 ? notes[0].id : null;
}

function isMobile() { return window.innerWidth <= 760; }

// On mobile, showing the editor/chat hides the sidebar list entirely
// and shows a back button; on desktop both panels are always visible.
function showMobileEditor() {
  if (!isMobile()) return;
  document.getElementById('sidebar').classList.add('mobile-hidden');
  document.getElementById('editor-area').classList.add('mobile-visible');
}
function showMobileList() {
  if (!isMobile()) return;
  document.getElementById('sidebar').classList.remove('mobile-hidden');
  document.getElementById('editor-area').classList.remove('mobile-visible');
}
function collapseMobileSidebar() {
  showMobileEditor();
}

/* =========================================================
   NOTE LIST RENDERING
   ========================================================= */

function renderSidebar() {
  const plan = getCurrentPlan();
  const limit = plan.limit;

  const badge = document.getElementById('plan-badge');
  badge.textContent = plan.name.toLowerCase();
  badge.className = 'plan-badge ' + plan.badgeClass;

  const searchBox = document.getElementById('sidebar-search');
  searchBox.classList.toggle('hidden', !plan.perks.search);
  if (!plan.perks.search) document.getElementById('search-input').value = '';

  const query = plan.perks.search ? document.getElementById('search-input').value.trim().toLowerCase() : '';

  let ordered = notes.slice();
  if (!plan.perks.pin) {
    // if pin perk isn't active, ignore stored pinned flag for ordering
    ordered.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  }

  let visible = ordered;
  if (query) {
    visible = ordered.filter(n =>
      (n.title || '').toLowerCase().includes(query) ||
      (n.content || '').toLowerCase().includes(query) ||
      (n.tag || '').toLowerCase().includes(query)
    );
  }

  const listEl = document.getElementById('note-list');
  listEl.innerHTML = '';

  if (notes.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'note-item-empty-state';
    empty.textContent = 'Заметок пока нет';
    listEl.appendChild(empty);
  } else if (visible.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'note-item-empty-state';
    empty.textContent = 'Ничего не найдено';
    listEl.appendChild(empty);
  }

  visible.forEach((note, visibleIdx) => {
    const idx = notes.indexOf(note);
    const item = document.createElement('div');
    item.className = 'note-item' + (note.id === activeNoteId ? ' active' : '');
    item.style.animationDelay = Math.min(visibleIdx * 25, 300) + 'ms';
    item.onclick = () => selectNote(note.id);

    const num = document.createElement('span');
    num.className = 'note-num';
    num.textContent = String(idx + 1).padStart(2, '0');

    const title = document.createElement('span');
    const hasTitle = note.title && note.title.trim().length > 0;
    title.className = 'note-item-title' + (hasTitle ? '' : ' note-item-empty');
    title.textContent = hasTitle ? note.title : 'без названия';
    title.title = 'Двойной клик — переименовать';
    title.ondblclick = (e) => { e.stopPropagation(); renameNotePrompt(note.id); };

    item.appendChild(num);

    if (plan.perks.pin) {
      const pinBtn = document.createElement('button');
      pinBtn.type = 'button';
      pinBtn.className = 'note-pin-btn' + (note.pinned ? ' pinned' : '');
      pinBtn.textContent = note.pinned ? '★' : '☆';
      pinBtn.title = note.pinned ? 'Открепить' : 'Закрепить';
      pinBtn.onclick = async (e) => {
        e.stopPropagation();
        note.pinned = !note.pinned;
        await db.from('notes').update({ pinned: note.pinned }).eq('id', note.id);
        await loadNotes();
        activeNoteId = note.id;
        renderSidebar();
      };
      item.appendChild(pinBtn);
    }

    item.appendChild(title);

    if (plan.perks.tags && note.tag) {
      const tagEl = document.createElement('span');
      tagEl.className = 'note-tag';
      tagEl.textContent = note.tag;
      item.appendChild(tagEl);
    }

    if (plan.perks.lockNote && note.locked) {
      const lockEl = document.createElement('span');
      lockEl.style.fontSize = '12px';
      lockEl.style.color = 'var(--text-dim)';
      lockEl.style.flexShrink = '0';
      lockEl.textContent = '🔒';
      item.appendChild(lockEl);
    }

    listEl.appendChild(item);
  });

  const count = notes.length;
  document.getElementById('quota-text').textContent = count + ' / ' + limit + ' заметок';
  const fill = document.getElementById('quota-fill');
  const pct = Math.min(100, (count / limit) * 100);
  fill.style.width = pct + '%';
  fill.classList.toggle('full', count >= limit);

  const limitReached = count >= limit;
  const newBtn = document.getElementById('new-note-btn');
  newBtn.disabled = false;
  if (limitReached) {
    newBtn.textContent = 'лимит исчерпан — улучшить план →';
    newBtn.onclick = openPricing;
  } else {
    newBtn.textContent = '+ новая заметка';
    newBtn.onclick = createNote;
  }

  const hintRow = document.getElementById('locked-hint');
  const hintText = document.getElementById('locked-hint-text');
  if (plan.key === 'free') {
    hintRow.classList.remove('hidden');
    hintText.textContent = 'поиск, закрепление и другое — в платных планах';
  } else if (plan.key === 's') {
    hintRow.classList.remove('hidden');
    hintText.textContent = 'теги, экспорт и история — с плана "Про"';
  } else if (plan.key === 'm') {
    hintRow.classList.remove('hidden');
    hintText.textContent = 'история версий и пароль на заметку — со "Студии"';
  } else {
    hintRow.classList.add('hidden');
  }
}

async function renameNotePrompt(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  const next = await showPrompt('Название заметки:', note.title || '', { eyebrow: 'переименовать' });
  if (next === null) return;
  note.title = next.trim();
  await db.from('notes').update({ title: note.title, updated_at: new Date().toISOString() }).eq('id', id);
  await loadNotes();
  activeNoteId = id;
  renderSidebar();
  if (activeNoteId === id) renderEditor();
}

/* =========================================================
   EDITOR RENDERING
   ========================================================= */

function renderEditor() {
  const area = document.getElementById('editor-area');
  area.innerHTML = '';

  const note = notes.find(n => n.id === activeNoteId);
  const plan = getCurrentPlan();

  if (!note) {
    area.innerHTML = `<div class="editor-empty"></div>`;
    return;
  }

  if (plan.perks.lockNote && note.locked && note.id !== unlockedNoteId) {
    area.innerHTML = `
      <div class="editor-empty">
        <div class="editor-empty-title">🔒 Заметка защищена паролем</div>
        <div>Введите пароль, чтобы открыть «${escapeHtml(note.title || 'без названия')}».</div>
        <input type="password" id="unlock-input" class="unlock-input">
        <button type="button" onclick="tryUnlockNote('${note.id}')">Открыть</button>
      </div>`;
    const unlockInput = document.getElementById('unlock-input');
    unlockInput.focus();
    unlockInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlockNote(note.id); });
    return;
  }

  const topbar = document.createElement('div');
  topbar.className = 'editor-topbar';

  const backBtn = document.createElement('button');
  backBtn.type = 'button';
  backBtn.className = 'mobile-back-btn';
  backBtn.textContent = '← назад';
  backBtn.onclick = showMobileList;
  topbar.appendChild(backBtn);

  const titleInput = document.createElement('input');
  titleInput.className = 'editor-title-input';
  titleInput.placeholder = 'Название заметки';
  titleInput.value = note.title || '';
  titleInput.oninput = () => {
    note.title = titleInput.value;
    scheduleSave();
    renderSidebarTitleOnly();
  };

  const actions = document.createElement('div');
  actions.className = 'editor-actions';

  if (plan.perks.tags) {
    const tagInput = document.createElement('input');
    tagInput.value = note.tag || '';
    tagInput.placeholder = 'тег';
    tagInput.style.cssText = 'width:90px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;color:var(--text-dim);font-family:"JetBrains Mono",monospace;font-size:12px;padding:8px 10px;outline:none;min-height:38px;';
    tagInput.oninput = () => { note.tag = tagInput.value.trim(); scheduleSave(); };
    tagInput.onblur = () => renderSidebar();
    actions.appendChild(tagInput);
  }

  if (plan.perks.exportTxt) {
    const exportBtn = document.createElement('button');
    exportBtn.type = 'button';
    exportBtn.className = 'icon-btn neutral';
    exportBtn.textContent = 'экспорт .txt';
    exportBtn.onclick = () => exportNote(note);
    actions.appendChild(exportBtn);
  }

  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'icon-btn neutral';
  copyBtn.textContent = 'скопировать';
  copyBtn.onclick = () => {
    copyTextToClipboard(textarea.value, () => {
      copyBtn.textContent = 'скопировано ✓';
      setTimeout(() => { copyBtn.textContent = 'скопировать'; }, 1200);
    });
  };
  actions.appendChild(copyBtn);

  if (plan.perks.history) {
    const histBtn = document.createElement('button');
    histBtn.type = 'button';
    histBtn.className = 'icon-btn neutral';
    histBtn.textContent = 'история';
    histBtn.onclick = () => showHistory(note);
    actions.appendChild(histBtn);
  }

  if (plan.perks.lockNote) {
    const lockBtn = document.createElement('button');
    lockBtn.type = 'button';
    lockBtn.className = 'icon-btn neutral';
    lockBtn.textContent = note.locked ? 'снять пароль' : 'поставить пароль';
    lockBtn.onclick = () => toggleLock(note);
    actions.appendChild(lockBtn);
  }

  const status = document.createElement('span');
  status.className = 'save-status';
  status.id = 'save-status';
  status.textContent = formatUpdated(note.updated_at);

  const wordCounter = document.createElement('span');
  wordCounter.className = 'word-counter';
  wordCounter.id = 'word-counter';

  const delBtn = document.createElement('button');
  delBtn.type = 'button';
  delBtn.className = 'icon-btn';
  delBtn.textContent = 'удалить';
  delBtn.onclick = () => deleteNote(note.id);

  actions.appendChild(wordCounter);
  actions.appendChild(status);
  actions.appendChild(delBtn);
  topbar.appendChild(titleInput);
  topbar.appendChild(actions);

  const textarea = document.createElement('textarea');
  textarea.id = 'note-textarea';
  textarea.spellcheck = false;
  textarea.value = note.content || '';
  textarea.placeholder = 'Пишите или вставляйте сюда что угодно — текст или код.\nТабуляция, пробелы и переносы строк сохранятся ровно так, как есть.';

  const wordLimit = getWordLimit();

  function updateWordCounter() {
    const count = countWords(textarea.value);
    wordCounter.textContent = count.toLocaleString('ru-RU') + ' / ' + wordLimit.toLocaleString('ru-RU') + ' слов';
    wordCounter.classList.toggle('limit-reached', count >= wordLimit);
  }
  updateWordCounter();

  textarea.oninput = () => {
    if (countWords(textarea.value) > wordLimit) {
      // Превышение — обрезаем до последнего разрешённого слова, не давая печатать дальше.
      const words = textarea.value.trim().split(/\s+/);
      const trimmedValue = words.slice(0, wordLimit).join(' ');
      const cursorAtEnd = textarea.selectionStart === textarea.value.length;
      textarea.value = trimmedValue + (cursorAtEnd ? '' : textarea.value.slice(trimmedValue.length));
      if (cursorAtEnd) textarea.selectionStart = textarea.selectionEnd = textarea.value.length;
    }
    note.content = textarea.value;
    updateWordCounter();
    scheduleSave();
  };
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      textarea.value = textarea.value.substring(0, start) + '\t' + textarea.value.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + 1;
      note.content = textarea.value;
      updateWordCounter();
      scheduleSave();
    }
  });

  area.appendChild(topbar);
  area.appendChild(textarea);
  if (window.innerWidth > 760) textarea.focus();
}

async function toggleLock(note) {

    note.lock_password = null;
  } else {
    const pass = await showPrompt('Придумайте пароль для этой заметки:', '', { eyebrow: 'защита паролем', password: true, confirmLabel: 'Поставить' });
    if (!pass) return;
    note.locked = true;

async function exportNote(note) {
  const filename = (note.title && note.title.trim() ? note.title.trim() : 'без названия') + '.txt';
  const ok = await showConfirm(`Файл «${filename}» будет сохранён на устройство.`, { eyebrow: 'экспорт заметки', confirmLabel: 'Скачать' });
  if (!ok) return;

  const blob = new Blob([note.content || ''], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function showHistory(note) {
  const { data: history, error } = await db
    .from('note_history')
    .select('*')
    .eq('note_id', note.id)
    .order('at', { ascending: false })
    .limit(10);

  if (error || !history || history.length === 0) {
    await showAlert('История версий пока пуста — она начнёт заполняться по мере редактирования.', 'история версий');

function formatUpdated(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return 'сохранено ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

async function deleteNote(id) {
  const ok = await showConfirm('Удалить эту заметку без возможности восстановления?', { eyebrow: 'удаление заметки', confirmLabel: 'Удалить', danger: true });
  if (!ok) return;

  const { error } = await db
    .from('notes')
    .delete()
    .eq('id', id)
    .eq('user_id', currentUser.id);

  if (error) {
    await showAlert('Не удалось удалить заметку: ' + error.message, 'ошибка');
    return;
  }

  // Убираем заметку локально сразу, чтобы интерфейс обновился
  // не дожидаясь ответа сервера (и даже если реального удаления
  // из-за какой-то гонки/кеша не произойдёт при следующей загрузке).
  notes = notes.filter(n => n.id !== id);
  if (activeNoteId === id) {
    activeNoteId = notes.length > 0 ? notes[0].id : null;
  }
  renderSidebar();
  renderEditor();

  await loadNotes();
  renderSidebar();
  renderEditor();
  showMobileList();
}

function scheduleSave() {
  const statusEl = document.getElementById('save-status');
  if (statusEl) {
    statusEl.textContent = 'сохранение…';
    statusEl.classList.remove('saved');
  }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const note = notes.find(n => n.id === activeNoteId);
    if (!note) return;

    const nowIso = new Date().toISOString();
    note.updated_at = nowIso;

    await db.from('notes').update({
      title: note.title, content: note.content, tag: note.tag, updated_at: nowIso
    }).eq('id', note.id);

    if (getCurrentPlan().perks.history) {
      await db.from('note_history').insert({ note_id: note.id, content: note.content });
    }

    const el = document.getElementById('save-status');
    if (el) {
      el.textContent = formatUpdated(nowIso);
      el.classList.add('saved');
    }
  }, 600);
}

function attachCardFormatting() {
  const numInput = document.getElementById('card-number');
  const expInput = document.getElementById('card-exp');
  const cvcInput = document.getElementById('card-cvc');

  numInput.addEventListener('input', () => {
    let digits = numInput.value.replace(/\D/g, '').slice(0, 16);
    numInput.value = digits.replace(/(.{4})/g, '$1 ').trim();
    clearFieldError('card-number', 'err-number');
  });
  expInput.addEventListener('input', () => {
    let digits = expInput.value.replace(/\D/g, '').slice(0, 4);
    expInput.value = digits.length >= 3 ? digits.slice(0, 2) + '/' + digits.slice(2) : digits;
    clearFieldError('card-exp', 'err-exp');
  });
  cvcInput.addEventListener('input', () => {
    cvcInput.value = cvcInput.value.replace(/\D/g, '').slice(0, 3);
    clearFieldError('card-cvc', 'err-cvc');
  });
}

function clearFieldError(inputId, errId) {
  document.getElementById(inputId).classList.remove('field-invalid');
  document.getElementById(errId).textContent = '';
}
function setFieldError(inputId, errId, message) {
  document.getElementById(inputId).classList.add('field-invalid');
  document.getElementById(errId).textContent = message;
}

function luhnValid(digits) {
  let sum = 0, shouldDouble = false;
  for (let i = digits.length - 1; i >= 0; i--) {
    let d = parseInt(digits[i], 10);
    if (shouldDouble) { d *= 2; if (d > 9) d -= 9; }
    sum += d;
    shouldDouble = !shouldDouble;
  }
  return sum % 10 === 0;
}

function validateCheckoutForm() {
  let valid = true;
  const rawNumber = document.getElementById('card-number').value.replace(/\D/g, '');
  if (rawNumber.length !== 16) { setFieldError('card-number', 'err-number', 'Номер карты должен содержать 16 цифр.'); valid = false; }
  else if (!luhnValid(rawNumber)) { setFieldError('card-number', 'err-number', 'Похоже, номер карты введён с ошибкой.'); valid = false; }

  const expRaw = document.getElementById('card-exp').value.trim();
  const expMatch = expRaw.match(/^(\d{2})\/(\d{2})$/);
  if (!expMatch) { setFieldError('card-exp', 'err-exp', 'Формат — ММ/ГГ, например 09/28.'); valid = false; }
  else {
    const month = parseInt(expMatch[1], 10);
    const year = 2000 + parseInt(expMatch[2], 10);
    if (month < 1 || month > 12) { setFieldError('card-exp', 'err-exp', 'Месяц должен быть от 01 до 12.'); valid = false; }
    else {
      const now = new Date();
      const expiresBeforeNow = year < now.getFullYear() || (year === now.getFullYear() && month < now.getMonth() + 1);
      if (expiresBeforeNow) { setFieldError('card-exp', 'err-exp', 'Срок действия карты уже истёк.'); valid = false; }
    }
  }

  const cvc = document.getElementById('card-cvc').value.trim();
  if (!/^\d{3}$/.test(cvc)) { setFieldError('card-cvc', 'err-cvc', 'CVC — это 3 цифры на обороте карты.'); valid = false; }
  return valid;
}

async function runAdminSearch() {
  const query = document.getElementById('admin-search-input').value.trim();
  if (!query) return;

  const resultEl = document.getElementById('admin-result');
  resultEl.innerHTML = `<div class="admin-empty loading-pulse">Поиск…</div>`;

  const looksLikeUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(query);

  let rows = [];
  if (looksLikeUuid) {
    const { data } = await db.from('profiles').select('*').eq('id', query).limit(1);
    rows = data || [];
  } else {
    const { data } = await db.from('profiles').select('*').ilike('display_name', `%${query}%`).limit(10);

  if (rows.length === 0) {
    resultEl.innerHTML = `<div class="admin-empty">Никого не найдено. Проверьте ID или имя.</div>`;

  resultEl.innerHTML = rows.map(r => `
    <div class="recent-group-item" onclick="selectAdminUserById('${r.id}')">
